<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Upload Portal - Rainbow Collection</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #040717;
            color: #f3f4f6;
            min-height: 100vh;
        }
        .brand-title { font-family: 'Cinzel', serif; }
    </style>
</head>
<body class="flex items-center justify-center p-4">

    <!-- Passcode Gate -->
    <div id="auth-box" class="bg-[#0b102b] border border-indigo-800/80 rounded-3xl max-w-sm w-full p-8 shadow-2xl text-center">
        <h3 class="text-xl font-bold text-amber-300 brand-title mb-2">Restricted Area</h3>
        <p class="text-xs text-gray-400 mb-6">Enter owner passcode to access product uploader.</p>
        <input type="password" id="passcode-input" placeholder="Passcode" class="w-full bg-indigo-950/80 border border-indigo-800 rounded-xl p-3 text-sm text-white text-center mb-4 focus:outline-none focus:border-amber-400">
        <button onclick="verifyPasscode()" class="w-full py-3 rounded-xl bg-amber-600 hover:bg-amber-500 text-white text-xs font-semibold tracking-wider uppercase transition">Unlock Portal</button>
        <div class="mt-6">
            <a href="index.html" class="text-xs text-indigo-400 underline">← Return to Public Store</a>
        </div>
    </div>

    <!-- Upload Panel (Hidden until unlocked) -->
    <div id="upload-panel" class="hidden bg-[#0b102b] border border-indigo-800/80 rounded-3xl max-w-xl w-full p-6 sm:p-8 shadow-2xl my-8">
        <div class="flex justify-between items-center mb-6 border-b border-indigo-900 pb-4">
            <div>
                <h3 class="text-xl font-bold text-amber-300 brand-title">Owner Upload Portal</h3>
                <p class="text-xs text-gray-400">Add products to your Diwali collection</p>
            </div>
            <a href="index.html" class="text-xs px-3 py-1.5 rounded-lg bg-indigo-950 text-indigo-300 border border-indigo-800">View Store ↗</a>
        </div>
        
        <form id="product-form" onsubmit="handleProductSubmit(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-300 mb-1">Product Name</label>
                <input type="text" id="p-name" required placeholder="e.g. Royal Crystal Diya Set" class="w-full bg-indigo-950/60 border border-indigo-800/80 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-purple-500">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-gray-300 mb-1">Price (HKD)</label>
                    <input type="number" id="p-price" required placeholder="188" class="w-full bg-indigo-950/60 border border-indigo-800/80 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-purple-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-gray-300 mb-1">Upload Picture</label>
                    <input type="file" id="p-image-file" accept="image/*" required class="w-full text-xs text-gray-400 file:mr-2 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-purple-950 file:text-purple-200 cursor-pointer bg-indigo-950/60 border border-indigo-800/80 rounded-xl p-1.5">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-300 mb-1">Select Categories (Multi-select)</label>
                <div id="category-checkboxes" class="grid grid-cols-2 gap-2 mt-2 bg-indigo-950/40 p-3 rounded-xl border border-indigo-900/60"></div>
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-300 mb-1">Description</label>
                <textarea id="p-desc" rows="3" placeholder="Handcrafted with intricate details..." class="w-full bg-indigo-950/60 border border-indigo-800/80 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-purple-500"></textarea>
            </div>

            <div class="flex justify-end gap-3 pt-4">
                <button type="submit" class="w-full py-3 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-600 text-white text-xs font-semibold uppercase tracking-wider hover:from-emerald-500 hover:to-teal-500 transition shadow-lg">Save & Publish Product</button>
            </div>
        </form>

        <div class="mt-8 pt-6 border-t border-indigo-900">
            <h4 class="text-xs font-semibold uppercase text-gray-400 mb-3">Manage Existing Uploads</h4>
            <div id="uploaded-list" class="space-y-2 max-h-48 overflow-y-auto pr-2"></div>
        </div>
    </div>

    <script>
        const categories = [
            { id: 'diyas', name: 'Diyas', icon: '🪔' },
            { id: 'toran', name: 'Toran', icon: '🌸' },
            { id: 'hangings', name: 'Hangings', icon: '🏮' },
            { id: 'hampers', name: 'Hampers', icon: '🎁' },
            { id: 'gifts', name: 'Gifts and home decor', icon: '✨' },
            { id: 'rangoli', name: 'Rangoli', icon: '🎨' },
            { id: 'shubhlabh', name: 'Shubh Labh', icon: '🪷' }
        ];

        function verifyPasscode() {
            const val = document.getElementById('passcode-input').value;
            if (val === 'Ilovarainbowwithoutcolors') {
                document.getElementById('auth-box').classList.add('hidden');
                document.getElementById('upload-panel').classList.remove('hidden');
                renderCheckboxes();
                renderManageList();
            } else {
                alert('Incorrect passcode!');
            }
        }

        function renderCheckboxes() {
            const container = document.getElementById('category-checkboxes');
            let html = '';
            categories.forEach(cat => {
                html += `
                    <label class="flex items-center gap-2 text-xs text-gray-300 cursor-pointer p-1.5 hover:bg-indigo-900/40 rounded-lg">
                        <input type="checkbox" name="product-cat" value="${cat.id}" class="rounded border-indigo-700 text-purple-600">
                        <span>${cat.icon} ${cat.name}</span>
                    </label>
                `;
            });
            container.innerHTML = html;
        }

        function handleProductSubmit(e) {
            e.preventDefault();
            const name = document.getElementById('p-name').value;
            const price = parseFloat(document.getElementById('p-price').value);
            const desc = document.getElementById('p-desc').value;
            const fileInput = document.getElementById('p-image-file');

            const selectedCheckboxes = document.querySelectorAll('input[name="product-cat"]:checked');
            const selectedCategories = Array.from(selectedCheckboxes).map(cb => cb.value);

            if (selectedCategories.length === 0) {
                alert('Please select at least one category.');
                return;
            }

            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const newProduct = {
                        id: Date.now(),
                        name,
                        price,
                        image: e.target.result,
                        desc,
                        categories: selectedCategories
                    };

                    let products = JSON.parse(localStorage.getItem('rainbow_diwali_products')) || [];
                    products.unshift(newProduct);
                    localStorage.setItem('rainbow_diwali_products', JSON.stringify(products));

                    document.getElementById('product-form').reset();
                    renderManageList();
                    alert('Product successfully published to your store!');
                };
                reader.readAsDataURL(fileInput.files[0]);
            }
        }

        function renderManageList() {
            let products = JSON.parse(localStorage.getItem('rainbow_diwali_products')) || [];
            const list = document.getElementById('uploaded-list');
            if (products.length === 0) {
                list.innerHTML = '<p class="text-xs text-gray-500">No products uploaded yet.</p>';
                return;
            }
            let html = '';
            products.forEach(p => {
                html += `
                    <div class="flex items-center justify-between bg-indigo-950/60 p-2 rounded-xl border border-indigo-900">
                        <span class="text-xs text-gray-300 truncate max-w-[250px]">${p.name} (HKD $${p.price})</span>
                        <button onclick="deleteProduct(${p.id})" class="text-[10px] bg-rose-950 text-rose-300 px-2 py-1 rounded border border-rose-800">Delete</button>
                    </div>
                `;
            });
            list.innerHTML = html;
        }

        function deleteProduct(id) {
            if (confirm('Are you sure you want to delete this product?')) {
                let products = JSON.parse(localStorage.getItem('rainbow_diwali_products')) || [];
                products = products.filter(p => p.id !== id);
                localStorage.setItem('rainbow_diwali_products', JSON.stringify(products));
                renderManageList();
            }
        }
    </script>
</body>
</html>
